<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 B · 极简专业 — Todo</title>
<style>
  :root{
    --bg:#fcfcfd;
    --card:#ffffff;
    --ink:#15181e;
    --ink-2:#5c6370;
    --ink-3:#9aa0ab;
    --line:#e8eaee;
    --line-2:#f0f1f4;
    --primary:#4f46e5;
    --primary-soft:#eef0fd;
    --danger:#dc2626;
    --radius:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;
  }
  .app{max-width:860px;margin:0 auto;padding:40px 24px 80px}

  /* 顶栏 */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:650;letter-spacing:-.2px}
  .logo{
    width:26px;height:26px;border-radius:7px;background:var(--ink);
    display:grid;place-items:center;color:#fff;font-size:13px;
  }
  .icon-btn{
    border:none;background:transparent;width:34px;height:34px;border-radius:var(--radius);
    display:grid;place-items:center;cursor:pointer;color:var(--ink-3);transition:.13s;
  }
  .icon-btn:hover{color:var(--ink);background:#f2f3f6}
  .icon-btn svg{width:18px;height:18px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px}

  /* Tabs：文字式 + 下划线 */
  .tabs{display:flex;align-items:center;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tab{
    border:none;background:transparent;color:var(--ink-2);font-size:13.5px;font-weight:500;
    padding:14px 12px 12px;cursor:pointer;display:flex;align-items:center;gap:7px;
    border-bottom:2px solid transparent;margin-bottom:-1px;transition:.13s;font-family:inherit;
  }
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--ink);font-weight:650;border-bottom-color:var(--ink)}
  .tab .badge{
    font-size:11px;font-weight:500;background:#f1f2f5;color:var(--ink-3);
    min-width:18px;height:18px;border-radius:5px;display:grid;place-items:center;padding:0 5px;
  }
  .tab.active .badge{background:var(--primary-soft);color:var(--primary)}
  .tab.add{color:var(--ink-3);font-size:16px;padding:11px 10px 12px}
  .tab.add:hover{color:var(--primary)}

  /* 任务列表 */
  .task-list{list-style:none;padding:6px 8px}
  .task{
    display:flex;align-items:center;gap:11px;padding:7px 8px;border-radius:6px;
    transition:background .1s;
  }
  .task:hover{background:#f7f8fa}
  .task:hover .ops{opacity:1}
  .check{
    width:18px;height:18px;border-radius:50%;border:1.8px solid #c9ced8;cursor:pointer;flex:none;
    display:grid;place-items:center;transition:.13s;background:transparent;padding:0;
  }
  .check svg{width:10px;height:10px;color:#fff;opacity:0;transform:scale(.5);transition:.13s}
  .check:hover{border-color:var(--primary)}
  .task.done .check{background:var(--ink-2);border-color:var(--ink-2)}
  .task.done .check svg{opacity:1;transform:scale(1)}
  .title{flex:1;line-height:1.5;cursor:default;outline:none;border-radius:4px;padding:1px 4px;margin-left:-4px}
  .title.editable{cursor:text}
  .title.editable:hover{background:#f4f5f8}
  .task.done .title{color:var(--ink-3);text-decoration:line-through}
  .g-tag{font-size:11px;color:var(--ink-2);background:#f3f4f6;padding:1.5px 8px;border-radius:5px;flex:none}
  .g-tag.none{color:var(--ink-3)}
  .ops{display:flex;gap:2px;opacity:0;transition:.13s;flex:none}
  .task .ops{min-width:85px;justify-content:flex-end}
  .op{
    border:none;background:transparent;width:27px;height:27px;border-radius:6px;cursor:pointer;
    display:grid;place-items:center;color:var(--ink-3);transition:.12s;
  }
  .op svg{width:14.5px;height:14.5px}
  .op:hover{background:#e9ebf0;color:var(--ink)}
  .op.del:hover{background:#fdecec;color:var(--danger)}

  .done-divider{display:flex;align-items:center;gap:10px;margin:6px 12px 2px;color:var(--ink-3);font-size:11.5px;font-weight:500}
  .done-divider::after{content:"";flex:1;height:1px;background:var(--line-2)}

  /* 添加行 */
  .add-row{display:flex;align-items:center;gap:9px;padding:10px 16px 14px}
  .add-row .plus{
    width:20px;height:20px;border-radius:50%;border:1.8px solid #c9ced8;color:var(--ink-3);
    display:grid;place-items:center;flex:none;font-size:13px;line-height:1;
  }
  .add-row input{flex:1;border:none;outline:none;font-size:13.5px;font-family:inherit;color:var(--ink);background:transparent}
  .add-row input::placeholder{color:var(--ink-3)}
  .select-wrap{position:relative;flex:none}
  .select-wrap select{
    appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:#fff;
    font-family:inherit;font-size:12px;color:var(--ink-2);font-weight:500;cursor:pointer;
    padding:5px 26px 5px 11px;border-radius:7px;outline:none;max-width:120px;
  }
  .select-wrap select:hover{border-color:#c9ced8}
  .select-wrap select:focus{border-color:var(--primary)}
  .select-wrap::after{
    content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;pointer-events:none;
    border-right:1.6px solid var(--ink-3);border-bottom:1.6px solid var(--ink-3);
    transform:translateY(-70%) rotate(45deg);
  }
  .add-row .g-tag{cursor:default}
  .archive-all{
    border:none;background:transparent;color:var(--ink-3);font-size:12px;font-weight:500;
    padding:5px 10px;border-radius:6px;cursor:pointer;font-family:inherit;flex:none;
  }
  .archive-all:hover{color:var(--primary);background:var(--primary-soft)}

  .empty{text-align:center;color:var(--ink-3);font-size:13px;padding:30px 0}

  /* 归档区：无背景，以标题分隔 */
  .archive-card{margin-top:22px;background:var(--card);border:1px solid var(--line)}
  .archive-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
  .archive-title{font-weight:650;display:flex;align-items:center;gap:8px;font-size:13.5px}
  .archive-title .sub{font-weight:400;font-size:12px;color:var(--ink-3)}
  .search-box{
    display:flex;align-items:center;gap:7px;background:#f7f8fa;border:1px solid transparent;
    border-radius:7px;padding:5px 10px;width:220px;transition:.13s;
  }
  .search-box:focus-within{background:#fff;border-color:#c9ced8}
  .search-box svg{width:14px;height:14px;color:var(--ink-3);flex:none}
  .search-box input{border:none;outline:none;font-size:13px;font-family:inherit;flex:1;background:transparent;color:var(--ink)}
  .archive-list{list-style:none;padding:6px 8px}
  .a-item{display:flex;align-items:center;gap:11px;padding:7px 8px;border-radius:6px}
  .a-item:hover{background:#f7f8fa}
  .a-item:hover .ops{opacity:1}
  .a-dot{width:5px;height:5px;border-radius:50%;background:#c9ced8;flex:none}
  .a-title{flex:1;color:var(--ink-2);font-size:13.5px}
  .a-date{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
  .archive-foot{padding:9px 18px 13px;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line-2)}

  /* 弹层 */
  .mask{
    position:fixed;inset:0;background:rgba(15,18,25,.4);
    display:none;align-items:flex-start;justify-content:center;padding-top:130px;z-index:20;
  }
  .mask.show{display:flex}
  .modal{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(15,18,30,.2);width:420px;max-width:92vw;padding:22px;animation:pop .15s ease}
  @keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
  .modal h3{font-size:15px;font-weight:650;margin-bottom:16px}
  .setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line-2)}
  .setting-row:last-of-type{border-bottom:none}
  .setting-row small{color:var(--ink-3);font-size:12px;line-height:1.6}
  .setting-row input[type=number]{
    width:70px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;
    font-family:inherit;outline:none;text-align:center;
  }
  .setting-row input[type=number]:focus{border-color:var(--primary)}
  .switch{position:relative;width:40px;height:22px;flex:none;appearance:none;-webkit-appearance:none;background:#d4d8e0;border-radius:999px;cursor:pointer;transition:.18s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .switch:checked{background:var(--primary)}
  .switch:checked::after{transform:translateX(18px)}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .btn{border:none;padding:7px 18px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.primary:hover{background:#000}
  .btn.ghost{background:#f2f3f6;color:var(--ink-2)}
  .btn.ghost:hover{background:#e8eaee}

  /* 分组管理 */
  .g-new{display:flex;gap:8px;margin-bottom:12px}
  .g-new input{flex:1;padding:8px 11px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;outline:none}
  .g-new input:focus{border-color:var(--primary)}
  .g-new button{border:none;background:var(--ink);color:#fff;width:36px;border-radius:7px;cursor:pointer;font-size:17px}
  .g-edit-list{list-style:none;display:flex;flex-direction:column;gap:4px;max-height:250px;overflow:auto}
  .g-edit-item{display:flex;align-items:center;gap:10px;padding:8px 11px;background:#f7f8fa;border-radius:7px}
  .g-edit-item .gname{flex:1;font-size:13.5px;outline:none;border-radius:4px;padding:2px 6px;margin-left:-6px}
  .g-edit-item .gname:focus{background:#fff;box-shadow:0 0 0 2px #dfe2f9}
  .g-count{font-size:11.5px;color:var(--ink-3)}
  .g-del{border:none;background:transparent;color:var(--ink-3);cursor:pointer;width:26px;height:26px;border-radius:6px;display:grid;place-items:center}
  .g-del svg{width:14px;height:14px}
  .g-del:hover{background:#fdecec;color:var(--danger)}
  .g-tip{font-size:12px;color:var(--ink-3);margin-top:11px;line-height:1.6}

  .style-note{position:fixed;right:14px;bottom:12px;font-size:11px;color:var(--ink-3);background:#fff;border:1px solid var(--line);padding:4px 10px;border-radius:6px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">✦</span>我的待办</div>
    <button class="icon-btn" id="settingsBtn" title="全局设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <section class="card">
    <nav class="tabs" id="tabs"></nav>
    <ul class="task-list" id="taskList"></ul>
    <div class="add-row">
      <span class="plus">+</span>
      <span id="groupPicker"></span>
      <input id="newTask" placeholder="添加任务，回车确认…">
      <button class="archive-all" id="archiveAll" style="display:none">全部归档</button>
    </div>
  </section>

  <section class="card archive-card">
    <div class="archive-head">
      <div class="archive-title">归档<span class="sub" id="archiveSub"></span></div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" placeholder="搜索归档任务…">
      </div>
    </div>
    <ul class="archive-list" id="archiveList"></ul>
    <div class="archive-foot" id="archiveFoot"></div>
  </section>
</div>

<div class="mask" id="settingsMask">
  <div class="modal">
    <h3>全局设置</h3>
    <label class="setting-row">
      <span>归档区显示条数<br><small>仅影响默认展示数量，搜索仍覆盖全部归档</small></span>
      <input type="number" id="setLimit" min="1" max="100" value="10">
    </label>
    <label class="setting-row">
      <span>自动归档<br><small>勾选完成后，任务直接进入归档区，不在上方停留</small></span>
      <input type="checkbox" class="switch" id="setAuto">
    </label>
    <div class="modal-actions"><button class="btn primary" id="settingsDone">完成</button></div>
  </div>
</div>

<div class="mask" id="groupMask">
  <div class="modal">
    <h3>管理分组</h3>
    <div class="g-new">
      <input id="newGroup" placeholder="新分组名称，回车添加…">
      <button id="addGroupBtn">+</button>
    </div>
    <ul class="g-edit-list" id="groupEditList"></ul>
    <div class="g-tip">双击分组名可重命名；删除分组后，组内任务会变为「未分组」，不会丢失。</div>
    <div class="modal-actions"><button class="btn ghost" id="groupDone">关闭</button></div>
  </div>
</div>

<div class="style-note">方案 B · 极简专业</div>

<script>
let groups = [
  {id:'g1', name:'工作'},
  {id:'g2', name:'生活'},
  {id:'g3', name:'学习'},
];
let seq = 100;
let tasks = [
  {id:1, title:'下午三点和产品评审', done:false, gid:'g1'},
  {id:2, title:'写完 Q3 周报', done:false, gid:'g1'},
  {id:3, title:'预约年度体检', done:false, gid:'g2'},
  {id:4, title:'买周末聚餐的食材', done:false, gid:'g2'},
  {id:5, title:'看完《设计心理学》第 4 章', done:false, gid:'g3'},
  {id:6, title:'整理 TypeScript 学习笔记', done:false, gid:'g3'},
  {id:7, title:'买牛奶', done:true, gid:'g2'},
  {id:8, title:'回复客户合同邮件', done:true, gid:'g1'},
];
let archived = [
  {id:11, title:'完成季度复盘', gid:'g1', date:'10-09'},
  {id:12, title:'整理电脑桌面文件', gid:'g2', date:'10-08'},
  {id:13, title:'提交差旅报销单', gid:'g1', date:'10-07'},
  {id:14, title:'健身房月卡续费', gid:'g2', date:'10-05'},
  {id:15, title:'看完《重构》第 6 章', gid:'g3', date:'10-04'},
  {id:16, title:'和设计师同步新版界面', gid:'g1', date:'10-03'},
  {id:17, title:'给妈妈买生日礼物', gid:'g2', date:'10-02'},
  {id:18, title:'整理浏览器书签', gid:null, date:'09-30'},
  {id:19, title:'输出 9 月工作总结', gid:'g1', date:'09-29'},
  {id:20, title:'跑完 5 公里', gid:'g2', date:'09-28'},
  {id:21, title:'背 50 个英语单词', gid:'g3', date:'09-27'},
  {id:22, title:'预约牙科洗牙', gid:'g2', date:'09-25'},
];
const settings = { limit:10, autoArchive:false };
let currentGroup = 'all';
let keyword = '';
let selectedNewGroup = '';

const $ = s => document.querySelector(s);
const gname = gid => (groups.find(g=>g.id===gid)||{}).name;

const ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>',
};

function renderTabs(){
  const count = gid => tasks.filter(t=>!t.done && (gid==='all'||t.gid===gid)).length;
  let html = `<button class="tab ${currentGroup==='all'?'active':''}" data-g="all">全部<span class="badge">${count('all')}</span></button>`;
  groups.forEach(g=>{
    html += `<button class="tab ${currentGroup===g.id?'active':''}" data-g="${g.id}">${g.name}<span class="badge">${count(g.id)}</span></button>`;
  });
  html += `<button class="tab add" id="openGroupMgr" title="管理分组">+</button>`;
  $('#tabs').innerHTML = html;
  $('#tabs').querySelectorAll('.tab[data-g]').forEach(b=>{
    b.onclick = ()=>{ currentGroup = b.dataset.g; renderAll(); };
  });
  $('#openGroupMgr').onclick = openGroupModal;
}

function renderTasks(){
  let list = tasks.filter(t=>currentGroup==='all'||t.gid===currentGroup);
  const undone = list.filter(t=>!t.done);
  const done = list.filter(t=>t.done);
  const showAll = currentGroup==='all';
  const row = (t, isDone)=>`
    <li class="task ${isDone?'done':''}" data-id="${t.id}">
      <button class="check" data-act="toggle">${ICON.check}</button>
      <span class="title${isDone?'':' editable'}" data-act="edit-title"${isDone?'':' title="双击编辑"'}>${t.title}</span>
      ${showAll ? `<span class="g-tag ${gname(t.gid)?'':'none'}">${gname(t.gid)||'未分组'}</span>` : ''}
      <span class="ops">
        ${isDone?`<button class="op" title="恢复为待办" data-act="reopen">${ICON.undo}</button><button class="op" title="归档" data-act="archive">${ICON.box}</button>`:
                  `<button class="op" title="重命名" data-act="rename">${ICON.edit}</button>`}
        <button class="op del" title="删除" data-act="del">${ICON.trash}</button>
      </span>
    </li>`;

  let html = undone.map(t=>row(t,false)).join('');
  if(done.length) html += `<div class="done-divider">已完成 ${done.length}</div>` + done.map(t=>row(t,true)).join('');
  if(!list.length) html = `<div class="empty">${currentGroup==='all'?'还没有任务，下面添加第一条吧':'这个分组下还没有任务'}</div>`;
  $('#taskList').innerHTML = html;

  $('#taskList').querySelectorAll('.task').forEach(li=>{
    const id = +li.dataset.id;
    li.querySelectorAll('[data-act]').forEach(b=>{
      b.onclick = e=>{
        e.stopPropagation();
        const act = b.dataset.act;
        const t = tasks.find(x=>x.id===id);
        if(act==='toggle') toggleDone(t);
        if(act==='reopen') t.done=false;
        if(act==='del') tasks = tasks.filter(x=>x.id!==id);
        if(act==='archive') toArchive(t);
        if(act==='rename') inlineEdit(li.querySelector('.title'), t);
        renderAll();
      };
    });
    const titleTask = tasks.find(x=>x.id===id);
    if(!titleTask.done){
      li.querySelector('.title').ondblclick = ()=>inlineEdit(li.querySelector('.title'), titleTask);
    }
  });
  $('#archiveAll').style.display = done.length ? 'block' : 'none';
  $('#archiveAll').textContent = `全部归档 (${done.length})`;
}

function inlineEdit(el, t){
  const input = document.createElement('input');
  input.value = t.title;
  input.style.cssText = 'flex:1;border:1px solid #c7cbf0;border-radius:6px;padding:3px 8px;font-size:14px;font-family:inherit;outline:none;color:inherit';
  el.replaceWith(input);
  input.focus(); input.select();
  const save = ()=>{ t.title = input.value.trim() || t.title; renderAll(); };
  input.onkeydown = e=>{ if(e.key==='Enter') save(); if(e.key==='Escape') renderAll(); };
  input.onblur = save;
}

function todayStr(){
  const d = new Date();
  return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function toggleDone(t){
  t.done = !t.done;
  if(t.done && settings.autoArchive) toArchive(t);
}
function toArchive(t){
  tasks = tasks.filter(x=>x.id!==t.id);
  archived.unshift({id:++seq, title:t.title, gid:t.gid, date:todayStr()});
}

function renderArchive(){
  const kw = keyword.trim();
  let list, foot;
  if(kw){
    list = archived.filter(a=>a.title.includes(kw) || (gname(a.gid)||'').includes(kw));
    foot = `在全部 ${archived.length} 条归档中搜索「${kw}」，找到 ${list.length} 条`;
  }else{
    list = archived.slice(0, settings.limit);
    foot = archived.length > settings.limit
      ? `显示最近 ${settings.limit} 条，共 ${archived.length} 条归档 — 在搜索框输入关键词可查找更早的任务`
      : `共 ${archived.length} 条归档`;
  }
  $('#archiveSub').textContent = kw ? '' : `· 最近 ${Math.min(settings.limit, archived.length)} 条`;
  $('#archiveList').innerHTML = list.length ? list.map(a=>`
    <li class="a-item" data-id="${a.id}">
      <span class="a-dot"></span>
      <span class="a-title">${a.title}</span>
      <span class="g-tag ${a.gid?'':'none'}">${gname(a.gid)||'未分组'}</span>
      <span class="a-date">${a.date}</span>
      <span class="ops">
        <button class="op" title="恢复为待办" data-act="restore">${ICON.undo}</button>
        <button class="op del" title="彻底删除" data-act="del">${ICON.trash}</button>
      </span>
    </li>`).join('')
    : `<div class="empty">${kw?'没有匹配的归档任务':'暂无归档任务'}</div>`;
  $('#archiveFoot').textContent = list.length ? foot : '';

  $('#archiveList').querySelectorAll('.a-item').forEach(li=>{
    const id = +li.dataset.id;
    li.querySelectorAll('[data-act]').forEach(b=>{
      b.onclick = ()=>{
        const a = archived.find(x=>x.id===id);
        if(b.dataset.act==='restore'){
          archived = archived.filter(x=>x.id!==id);
          tasks.push({id:++seq, title:a.title, done:false, gid:a.gid});
        }else{
          archived = archived.filter(x=>x.id!==id);
        }
        renderAll();
      };
    });
  });
}

function renderPicker(){
  const el = $('#groupPicker');
  if(currentGroup==='all'){
    el.innerHTML = `<span class="select-wrap"><select id="groupSelect">
      <option value="">未分组</option>
      ${groups.map(g=>`<option value="${g.id}" ${selectedNewGroup===g.id?'selected':''}>${g.name}</option>`).join('')}
    </select></span>`;
    $('#groupSelect').onchange = e=>{ selectedNewGroup = e.target.value; };
  }else{
    el.innerHTML = `<span class="g-tag">${gname(currentGroup)}</span>`;
  }
}

function renderAll(){ renderTabs(); renderPicker(); renderTasks(); renderArchive(); }

$('#newTask').addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const v = e.target.value.trim();
  if(!v) return;
  const gid = currentGroup==='all'
    ? (groups.some(g=>g.id===selectedNewGroup) ? selectedNewGroup : null)
    : currentGroup;
  tasks.push({id:++seq, title:v, done:false, gid});
  e.target.value='';
  renderAll();
});
$('#archiveAll').onclick = ()=>{
  tasks.filter(t=>t.done).forEach(t=>toArchive(t));
  renderAll();
};
$('#search').addEventListener('input', e=>{ keyword=e.target.value; renderArchive(); });

const mask = id => $(id);
$('#settingsBtn').onclick = ()=>{
  $('#setLimit').value = settings.limit;
  $('#setAuto').checked = settings.autoArchive;
  mask('#settingsMask').classList.add('show');
};
$('#settingsDone').onclick = ()=>{
  settings.limit = Math.max(1, Math.min(100, +$('#setLimit').value||10));
  settings.autoArchive = $('#setAuto').checked;
  mask('#settingsMask').classList.remove('show');
  renderAll();
};

function openGroupModal(){
  renderGroupEdit();
  mask('#groupMask').classList.add('show');
  setTimeout(()=>$('#newGroup').focus(),50);
}
function renderGroupEdit(){
  $('#groupEditList').innerHTML = groups.map(g=>{
    const n = tasks.filter(t=>t.gid===g.id).length + archived.filter(a=>a.gid===g.id).length;
    return `<li class="g-edit-item" data-id="${g.id}">
      <span class="gname">${g.name}</span>
      <span class="g-count">${n} 条任务</span>
      <button class="g-del" title="删除分组">${ICON.trash}</button>
    </li>`;
  }).join('');
  $('#groupEditList').querySelectorAll('.g-edit-item').forEach(li=>{
    const id = li.dataset.id, g = groups.find(x=>x.id===id);
    const nameEl = li.querySelector('.gname');
    nameEl.ondblclick = ()=>{
      nameEl.contentEditable = 'true';
      nameEl.focus();
      document.getSelection().selectAllChildren(nameEl);
      nameEl.onkeydown = e=>{
        if(e.key==='Enter'){e.preventDefault();g.name=nameEl.textContent.trim()||g.name;renderAll();renderGroupEdit();}
        if(e.key==='Escape') renderGroupEdit();
      };
      nameEl.onblur = ()=>{ g.name=nameEl.textContent.trim()||g.name; renderAll(); };
    };
    li.querySelector('.g-del').onclick = ()=>{
      groups = groups.filter(x=>x.id!==id);
      tasks.forEach(t=>{ if(t.gid===id) t.gid=null; });
      archived.forEach(a=>{ if(a.gid===id) a.gid=null; });
      if(currentGroup===id) currentGroup='all';
      renderAll(); renderGroupEdit();
    };
  });
}
const addGroup = ()=>{
  const v = $('#newGroup').value.trim();
  if(!v) return;
  groups.push({id:'g'+(++seq), name:v});
  $('#newGroup').value='';
  renderAll(); renderGroupEdit();
};
$('#addGroupBtn').onclick = addGroup;
$('#newGroup').addEventListener('keydown', e=>{ if(e.key==='Enter') addGroup(); });
$('#groupDone').onclick = ()=>mask('#groupMask').classList.remove('show');

document.querySelectorAll('.mask').forEach(m=>m.addEventListener('click', e=>{
  if(e.target===m) m.classList.remove('show');
}));

renderAll();
</script>
</body>
</html>
